<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glorious FC v7.3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0a0a;color:white}
.header{background:linear-gradient(90deg,#FFD700,#FF8C00);color:black;padding:12px;text-align:center;font-weight:bold}
.nav{display:flex;flex-wrap:wrap;background:#111;border-bottom:2px solid #FFD700;gap:5px;padding:8px}
.nav-btn{padding:10px;border-radius:20px;border:1px solid #FFD700;background:#222;color:#FFD700;font-weight:bold;cursor:pointer;font-size:11px;flex:1;min-width:90px}
.nav-btn.active{background:#FFD700;color:black}
.section{display:none;padding:10px}
.section.active{display:block}
.box{border:2px solid #FFD700;border-radius:12px;padding:12px;background:#111;margin-bottom:10px}
.title{font-weight:bold;margin-bottom:8px;color:#FFD700}
select,button,input{width:100%;padding:10px;border-radius:8px;border:1px solid #FFD700;background:#000;color:white;margin-bottom:6px}
button{background:linear-gradient(90deg,#FFD700,#FFA500);color:black;font-weight:bold;cursor:pointer}
.lineup-field{background:#0a4a0a;border:2px solid #FFD700;border-radius:12px;padding:10px;min-height:400px;display:block !important}
.pos-row{display:flex;justify-content:center;gap:6px;margin:10px 0}
.player-slot{width:70px;height:60px;background:#111;border:1px solid #FFD700;border-radius:8px;padding:4px;text-align:center;font-size:9px;display:flex;flex-direction:column;justify-content:center}
.filled{background:#222 !important;border-color:#00FF88 !important}
.ovr{color:#FFD700;font-weight:bold;font-size:12px}
</style>
</head>
<body>
<div class="header">👑 GLORIOUS FC v7.3 - Bottom Fixed</div>
<div class="nav">
<button id="btn-home" class="nav-btn active" onclick="openTab('home')">🏠 Home</button>
<button id="btn-lineup" class="nav-btn" onclick="openTab('lineup')">⚽ Lineup</button>
<button id="btn-music" class="nav-btn" onclick="openTab('music')">🎵 Music</button>
<button id="btn-market" class="nav-btn" onclick="openTab('market')">🔍 Market</button>
</div>

<div id="home" class="section active"><div class="box"><div class="title">v7.3 Bottom Fixed!</div><button onclick="openTab('lineup')">Go to Lineup Builder ⚽</button></div></div>
<div id="music" class="section"><div class="box"><div class="title">Music</div><audio id="bgm" controls style="width:100%"><source src="https://cdn.pixabay.com/download/audio/2022/06/07/audio_b9bd4170e8.mp3"></audio></div></div>
<div id="market" class="section"><div class="box"><div class="title">Players 110-122</div><div id="playerDB"></div></div></div>

<div id="lineup" class="section"><div class="box"><div class="title">⚽ LINEUP - 110-122 OVR + Rank 1-5 + Max Training</div>
<div style="background:#000;padding:8px;border-radius:8px;margin-bottom:8px">
<select id="formation"><option value="433">4-3-3</option><option value="442">4-4-2</option></select>
<select id="playerList"></select>
<select id="rankup"><option value="1">Rank 1 (+1)</option><option value="2">Rank 2 (+2)</option><option value="3">Rank 3 (+3)</option><option value="4">Rank 4 (+4)</option><option value="5" selected>Rank 5 (+5) MAX</option></select>
<select id="training"><option value="0">No Training</option><option value="30" selected>Maxed 30/30</option></select>
<button onclick="addPlayer()">➕ Add Player to Field</button>
<button style="background:#222;color:#FFD700" onclick="clearLineup()">Clear All</button>
<div id="calcResult" style="background:#001100;border:2px solid #00FF88;border-radius:8px;padding:8px;margin-top:8px;color:#00FF88;font-weight:bold">Team OVR: 0 - Add players!</div>
</div>
<div class="lineup-field" id="lineupField" style="background:#0a4a0a">Loading field...</div>
</div></div>

<script>
const players=[{name:"Messi",pos:"RW",ovr:122,base:122},{name:"Ronaldo",pos:"ST",ovr:122,base:122},{name:"Mbappe",pos:"ST",ovr:121,base:121},{name:"Haaland",pos:"ST",ovr:121,base:121},{name:"Van Dijk",pos:"CB",ovr:122,base:122},{name:"Bellingham",pos:"CM",ovr:122,base:122},{name:"Vinicius",pos:"LW",ovr:121,base:121},{name:"Salah",pos:"RW",ovr:120,base:120},{name:"Rodri",pos:"CDM",ovr:120,base:120},{name:"Courtois",pos:"GK",ovr:121,base:121},{name:"Pedri",pos:"CM",ovr:115,base:115},{name:"Saka",pos:"RW",ovr:114,base:114},{name:"Gavi",pos:"CM",ovr:112,base:112},{name:"Rashford",pos:"LW",ovr:110,base:110},{name:"Osimhen",pos:"ST",ovr:118,base:118}];
let lineup=[];
function openTab(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active');let btn=document.getElementById('btn-'+id);if(btn) btn.classList.add('active'); if(id==='lineup') setTimeout(renderField,100);}
function init(){let sel=document.getElementById('playerList');players.sort((a,b)=>b.ovr-a.ovr).forEach((p,i)=>{let o=document.createElement('option');o.value=i;o.text=`${p.name} ${p.pos} ${p.ovr} OVR`;sel.appendChild(o);});document.getElementById('playerDB').innerHTML=players.map(p=>`${p.name} ${p.pos} ${p.ovr} -> R5=${p.ovr+5}`).join('<br>'); renderField();}
function renderField(){let f=document.getElementById('formation').value;let slots={433:["ST","LW","RW","CM","CM","CM","LB","CB","CB","RB","GK"],442:["ST","ST","LM","CM","CM","RM","LB","CB","CB","RB","GK"]}[f];let field=document.getElementById('lineupField');if(!field) return;let html=`<div style="text-align:center;color:#FFD700;font-size:12px;font-weight:bold">Formation ${f} - ${lineup.length}/11 Players</div>`;for(let i=0;i<slots.length;i+=3){html+='<div class="pos-row">';for(let j=i;j<Math.min(i+3,slots.length);j++){let lp=lineup[j];if(lp) html+=`<div class="player-slot filled" onclick="removePlayer(${j})"><div class="ovr">${lp.realOVR}</div><div>${lp.name}</div><div>${lp.pos}</div><div>R${lp.rank} ${lp.training==30?'T30':''}</div></div>`;else html+=`<div class="player-slot"><div>${slots[j]}</div><div>Empty</div></div>`;}html+='</div>';}field.innerHTML=html;calc();}
function addPlayer(){let p=players[document.getElementById('playerList').value];let rank=parseInt(document.getElementById('rankup').value);let training=parseInt(document.getElementById('training').value);let realOVR=p.base+rank;if(lineup.length>=11){alert('11 full!');return;}lineup.push({name:p.name,pos:p.pos,base:p.base,rank,realOVR,training});renderField();}
function removePlayer(i){lineup.splice(i,1);renderField();}
function clearLineup(){lineup=[];renderField();}
function calc(){if(lineup.length==0){document.getElementById('calcResult').innerHTML='Team OVR: 0 - Add 110-122 players!';return;}let total=lineup.reduce((s,p)=>s+p.realOVR,0);let avg=Math.floor(total/lineup.length);let real=avg+(lineup.some(l=>l.training==30)?2:0);document.getElementById('calcResult').innerHTML=`Team OVR: <span style="color:#FFD700;font-size:20px">${avg}</span> | Real FC Mobile: <span style="color:#FFD700;font-size:22px">${real}</span><br>Players: ${lineup.length}/11 | Formula: Base + Rankup = Real OVR<br>Ex: Messi 122 + R5 = 127 + Training Max = ${122+5+2} feel!`;}
document.getElementById('formation').addEventListener('change',renderField);
init();
</script>
</body>
</html>
